# CI on every pull request (#675): hosted build and checks, independent of the agent that wrote the change.
# One job, named for the check the ruleset requires (`ci-required`). Separate jobs each billed at
# least a minute, so they were merged to save Actions minutes (2026-10-22). Docs-only PRs run only
# the fast steps: the secret scan, docs references, the public-content check, and the whitespace check.
# See docs/architecture/commit-policy.md > CI on pull requests.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.base_ref }}
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SEMGREP_VERSION: 1.181.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs-only means every changed path is Markdown or under docs/. Those PRs skip the build and
      # the code scanners; everything else runs the full set.
      - name: Does the PR change anything besides docs?
        id: changes
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Security scanning (#678). Free tools only (CodeQL needs Advanced Security on a private repo).
      # No third-party actions: the two binaries are pinned by version and SHA-256, and Semgrep by an
      # exact pip version at least a week old (the #697 cooldown). A finding that can't be fixed in the
      # PR gets an allowlist entry with a reason and a follow-up issue, never a silent skip.
      # How to handle a finding: docs/architecture/commit-policy.md > Security scanning.
      - name: Install gitleaks and actionlint (pinned, checksum-checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every PR, docs included: a key pasted into a doc is still a leak.
      - name: Secrets in this PR's commits (gitleaks)
        run: gitleaks git --log-opts="origin/${BASE_REF}..HEAD" --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ steps.changes.outputs.code == 'true' && 'npm' || '' }}

      - name: Docs references
        run: npm run check:docs

      # Every PR: the code goes public, so no private names, addresses, or support email (#942).
      - name: Public content
        run: npm run check:public

      - name: Whitespace errors in the diff
        run: git diff --check "origin/${BASE_REF}...HEAD"

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci --ignore-scripts

      - name: Typecheck and build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: File-size ratchet
        if: steps.changes.outputs.code == 'true'
        run: npm run check:size

      - name: Workflow lint (actionlint)
        if: steps.changes.outputs.code == 'true'
        run: actionlint -color

      - name: Production dependency audit (npm audit)
        if: steps.changes.outputs.code == 'true'
        run: npm audit --omit=dev --audit-level=high

      # Blocks on ERROR findings; WARNINGs go to the job summary.
      - name: Static analysis (Semgrep)
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off --quiet --json --output "$RUNNER_TEMP/semgrep.json"             --config p/javascript --config p/typescript --config p/github-actions
          node scripts/semgrep-summary.mjs "$RUNNER_TEMP/semgrep.json"
