# Flips an issue from `awaiting-dean` to `dean-replied` when the owner answers a question that
# ask-dean.yml posted (#227). The job-level `if:` skips every other comment, and a skipped job uses
# no Actions minutes. The skill or routine that asked picks the answer up with
# `node scripts/ask-dean.mjs --replies`. See docs/backlog-runner.md > Asking the owner. Answers on
# `support` and `review:asked-owner` issues also fire the routine that asked (jobs below), and
# any reply on a `sprint-review` issue fires the Review routine (#607). A calendar sync record
# (`<!-- calendar-synced: ... -->`, `<!-- calendar-removed: ... -->`, or `<!-- calendar-failed: ... -->`,
# #746) is posted by an agent as the owner, so every job skips it: it's never an answer. So is any
# comment with the Claude Code attribution footer or an agent marker (#1009); keep that list in step
# with `isAgentComment` in scripts/owner-calendar.mjs.
#
# Public code repo (#945): only the owner's login fires anything, and only in the backlog repo
# (`vars.BACKLOG_REPO`, #944), so a comment in the public repo, the owner's included, starts nothing.
name: Dean replied

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  flip:
    if: >-
      github.repository == (vars.BACKLOG_REPO || 'DeanPhillipsOKC/repbunny') &&
      github.event.comment.user.login == github.repository_owner &&
      !contains(github.event.comment.body, '<!-- calendar-synced:') &&
      !contains(github.event.comment.body, '<!-- calendar-removed:') &&
      !contains(github.event.comment.body, '<!-- calendar-failed:') &&
      !contains(github.event.comment.body, 'Generated with [Claude Code]') &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
      !contains(github.event.comment.body, '<!-- next-item') &&
      !contains(github.event.comment.body, '<!-- review-pr') &&
      !contains(github.event.comment.body, '<!-- review-closed') &&
      !contains(github.event.comment.body, '<!-- run-cost:') &&
      !contains(github.event.comment.body, '<!-- run-budget') &&
      !contains(github.event.comment.body, '<!-- sprint-review') &&
      !contains(github.event.comment.body, '<!-- support-evidence') &&
      !contains(github.event.comment.body, '<!-- qa-batch-asked') &&
      !contains(github.event.comment.body, '<!-- ask-dean') &&
      !contains(github.event.comment.body, '<!-- not-before:') &&
      contains(github.event.issue.labels.*.name, 'awaiting-dean')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Swap awaiting-dean for dean-replied
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label dean-replied --remove-label awaiting-dean

  # An answer on a `support` issue starts the Support triage routine so pass 1 carries it out
  # promptly (#309). Does nothing until the routine's secrets are set.
  fire-support:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' &&
      github.repository == (vars.BACKLOG_REPO || 'DeanPhillipsOKC/repbunny') &&
      github.event.comment.user.login == github.repository_owner &&
      !contains(github.event.comment.body, '<!-- calendar-synced:') &&
      !contains(github.event.comment.body, '<!-- calendar-removed:') &&
      !contains(github.event.comment.body, '<!-- calendar-failed:') &&
      !contains(github.event.comment.body, 'Generated with [Claude Code]') &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
      !contains(github.event.comment.body, '<!-- next-item') &&
      !contains(github.event.comment.body, '<!-- review-pr') &&
      !contains(github.event.comment.body, '<!-- review-closed') &&
      !contains(github.event.comment.body, '<!-- run-cost:') &&
      !contains(github.event.comment.body, '<!-- run-budget') &&
      !contains(github.event.comment.body, '<!-- sprint-review') &&
      !contains(github.event.comment.body, '<!-- support-evidence') &&
      !contains(github.event.comment.body, '<!-- qa-batch-asked') &&
      !contains(github.event.comment.body, '<!-- ask-dean') &&
      !contains(github.event.comment.body, '<!-- not-before:') &&
      contains(github.event.issue.labels.*.name, 'awaiting-dean') &&
      contains(github.event.issue.labels.*.name, 'support')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fire support routine
        run: node scripts/dispatch-support.mjs --force
        env:
          SUPPORT_ROUTINE_ID: ${{ secrets.SUPPORT_ROUTINE_ID }}
          SUPPORT_ROUTINE_TOKEN: ${{ secrets.SUPPORT_ROUTINE_TOKEN }}

  # An answer to a review question (issue labeled `review:asked-owner`, #374) starts the Review
  # (Opus) routine so it carries the answer out. Does nothing until the routine's secrets are set;
  # the routine also checks for answers at the start of every run.
  fire-review:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' &&
      github.repository == (vars.BACKLOG_REPO || 'DeanPhillipsOKC/repbunny') &&
      github.event.comment.user.login == github.repository_owner &&
      !contains(github.event.comment.body, '<!-- calendar-synced:') &&
      !contains(github.event.comment.body, '<!-- calendar-removed:') &&
      !contains(github.event.comment.body, '<!-- calendar-failed:') &&
      !contains(github.event.comment.body, 'Generated with [Claude Code]') &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
      !contains(github.event.comment.body, '<!-- next-item') &&
      !contains(github.event.comment.body, '<!-- review-pr') &&
      !contains(github.event.comment.body, '<!-- review-closed') &&
      !contains(github.event.comment.body, '<!-- run-cost:') &&
      !contains(github.event.comment.body, '<!-- run-budget') &&
      !contains(github.event.comment.body, '<!-- sprint-review') &&
      !contains(github.event.comment.body, '<!-- support-evidence') &&
      !contains(github.event.comment.body, '<!-- qa-batch-asked') &&
      !contains(github.event.comment.body, '<!-- ask-dean') &&
      !contains(github.event.comment.body, '<!-- not-before:') &&
      contains(github.event.issue.labels.*.name, 'awaiting-dean') &&
      contains(github.event.issue.labels.*.name, 'review:asked-owner')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fire review routine
        run: node scripts/fire-review.mjs --reply "$ISSUE" || case $? in 3|4) ;; *) exit 1 ;; esac
        env:
          ISSUE: ${{ github.event.issue.number }}
          REVIEW_ROUTINE_ID: ${{ secrets.REVIEW_ROUTINE_ID }}
          REVIEW_ROUTINE_TOKEN: ${{ secrets.REVIEW_ROUTINE_TOKEN }}

  # Any owner comment on an open sprint review issue (#607) starts the Review (Opus) routine, which
  # runs /sprint-review-reply: accepts changes, files follow-up and revert issues, and
  # rewrites the status line. The review issue is labeled `awaiting-dean` only until the first
  # reply, so this doesn't wait for that label. Does nothing until the routine's secrets are set.
  fire-sprint-review:
    if: >-
      vars.AUTOMATION_PAUSED != 'true' &&
      github.repository == (vars.BACKLOG_REPO || 'DeanPhillipsOKC/repbunny') &&
      github.event.comment.user.login == github.repository_owner &&
      !contains(github.event.comment.body, '<!-- calendar-synced:') &&
      !contains(github.event.comment.body, '<!-- calendar-removed:') &&
      !contains(github.event.comment.body, '<!-- calendar-failed:') &&
      !contains(github.event.comment.body, 'Generated with [Claude Code]') &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
      !contains(github.event.comment.body, '<!-- next-item') &&
      !contains(github.event.comment.body, '<!-- review-pr') &&
      !contains(github.event.comment.body, '<!-- review-closed') &&
      !contains(github.event.comment.body, '<!-- run-cost:') &&
      !contains(github.event.comment.body, '<!-- run-budget') &&
      !contains(github.event.comment.body, '<!-- sprint-review') &&
      !contains(github.event.comment.body, '<!-- support-evidence') &&
      !contains(github.event.comment.body, '<!-- qa-batch-asked') &&
      !contains(github.event.comment.body, '<!-- ask-dean') &&
      !contains(github.event.comment.body, '<!-- not-before:') &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'sprint-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fire review routine
        run: node scripts/fire-review.mjs --reply "$ISSUE" || case $? in 3|4) ;; *) exit 1 ;; esac
        env:
          ISSUE: ${{ github.event.issue.number }}
          REVIEW_ROUTINE_ID: ${{ secrets.REVIEW_ROUTINE_ID }}
          REVIEW_ROUTINE_TOKEN: ${{ secrets.REVIEW_ROUTINE_TOKEN }}
