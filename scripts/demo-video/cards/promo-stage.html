<!doctype html>
<!--
  The landscape stage for the Google Play promo video (#816), 1920x1080. The
  portrait clip plays in a phone on the left and a headline for each spoken
  line sits on the right, in the store screenshots' caption style (one pink
  phrase). play-promo.mjs screenshots three layers and stacks them in ffmpeg:
    ?layer=bg     the backdrop, the phone's body, and the name
    ?layer=bezel  the phone's rim alone, on transparent, laid over the clip to round its corners
    ?layer=head   one headline on transparent (&title=Text with *pink phrase*&sub=Smaller line)
  The phone's screen box (SCREEN below) is where the clip goes; window.STAGE reports it.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Baloo 2'; font-weight: 600 800; src: url(/site/fonts/baloo2-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 400 800; src: url(/site/fonts/manrope-latin.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; color: #f5edf2; font-family: 'Manrope', sans-serif; }
  body.layer-bg {
    background:
      radial-gradient(900px 700px at 92% 0%, rgba(242,135,156,.28), transparent 70%),
      radial-gradient(900px 760px at 0% 100%, rgba(183,156,240,.22), transparent 70%),
      #17111c;
  }
  .phone { position: absolute; border-radius: 64px; }
  .layer-bg .phone { background: #0d0910; box-shadow: 0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 3px #4a3a56; }
  .layer-bezel .phone { border: 16px solid #0d0910; outline: 3px solid #4a3a56; }
  .name { position: absolute; left: 980px; bottom: 84px; display: flex; align-items: center; gap: 16px; font: 800 40px 'Baloo 2', sans-serif; }
  .name img { width: 60px; height: 60px; border-radius: 16px; }
  .head { position: absolute; left: 980px; right: 120px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  h1 { font: 800 104px/1.02 'Baloo 2', sans-serif; letter-spacing: -1px; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
  h1 span { color: #f2879c; }
  p { margin-top: 28px; font-size: 40px; font-weight: 600; color: #cdbfca; }
</style>
</head>
<body>
  <script>
    // The clip is 480x1040; the screen keeps that shape.
    const SCREEN = { x: 384, y: 72, w: 432, h: 936 }
    const RIM = 16
    const q = new URLSearchParams(location.search)
    const layer = q.get('layer') ?? 'bg'
    document.body.className = `layer-${layer}`
    const phone = () => {
      const el = document.createElement('div')
      el.className = 'phone'
      Object.assign(el.style, { left: `${SCREEN.x - RIM}px`, top: `${SCREEN.y - RIM}px`, width: `${SCREEN.w + 2 * RIM}px`, height: `${SCREEN.h + 2 * RIM}px` })
      document.body.append(el)
    }
    if (layer === 'bg') {
      phone()
      document.body.insertAdjacentHTML('beforeend', '<div class="name"><img src="/site/img/icon.png" alt="" />RepBunny</div>')
    } else if (layer === 'bezel') {
      phone()
    } else {
      const box = document.createElement('div')
      box.className = 'head'
      const h1 = document.createElement('h1')
      const [before, accent, after] = (q.get('title') ?? '').split('*')
      h1.append(before ?? '')
      if (accent) {
        const span = document.createElement('span')
        span.textContent = accent
        h1.append(span, after ?? '')
      }
      const p = document.createElement('p')
      p.textContent = q.get('sub') ?? ''
      box.append(h1, p)
      document.body.append(box)
    }
    window.STAGE = { screen: SCREEN }
  </script>
</body>
</html>
