<!doctype html>
<!-- The link-preview card for repbunny.app (site/og-image.png, 1200x630). Render it with
     `node scripts/og-image/render.mjs`. Edit the pill text here when the launch state changes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Baloo 2'; src: url('../../site/fonts/baloo2-latin.woff2') format('woff2'); font-weight: 400 800; }
  @font-face { font-family: 'Manrope'; src: url('../../site/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; font-family: 'Manrope', sans-serif; color: #f5edf2;
    background:
      radial-gradient(520px 420px at 82% 38%, rgba(242,135,156,.34), transparent 70%),
      radial-gradient(460px 380px at 66% 92%, rgba(183,156,240,.28), transparent 70%),
      radial-gradient(380px 300px at 8% 0%, rgba(242,192,105,.12), transparent 70%),
      #17111c;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 34px/1 'Baloo 2', sans-serif; margin-bottom: 26px; }
  .brand img { width: 54px; height: 54px; border-radius: 14px; }
  h1 { font: 800 76px/1.02 'Baloo 2', sans-serif; letter-spacing: -1px; }
  h1 span { background: linear-gradient(90deg, #f2879c, #b79cf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 25px; font-weight: 600; color: #cdbfca; }
  .pill { margin-top: 30px; align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; font-size: 24px; font-weight: 800; color: #17111c; background: #f2c069; box-shadow: 0 10px 30px -8px rgba(242,192,105,.7); }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #17111c; }

  .phone { position: absolute; width: 262px; height: 514px; padding: 10px; border-radius: 42px; background: #0d0910; border: 2px solid #4a3a56; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04) inset; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 32px; display: block; }
  .back { left: 900px; top: 70px; transform: rotate(9deg); opacity: .92; }
  .front { left: 700px; top: 92px; transform: rotate(-6deg); }
  .toast { position: absolute; left: 640px; top: 112px; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 18px; background: #241a2c; border: 1.5px solid #4a3a56; box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); transform: rotate(-4deg); }
  .toast b { display: block; font-size: 20px; color: #f2c069; }
  .toast small { font-size: 16px; color: #cdbfca; }
  .toast .cup { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: #3a2c45; }
  .bunny { position: absolute; left: 610px; top: 380px; width: 230px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.55)); }
  .spark { position: absolute; color: #f2c069; font-size: 30px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../site/img/icon.png" alt="">RepBunny</div>
    <h1>The cutest way to <span>get stronger.</span></h1>
    <p class="sub">A quick, cozy workout log. Everything stays on your phone.</p>
    <p class="pill"><i></i>Now on Google Play</p>
  </div>
  <div class="phone back"><img src="../../site/img/shot-progress-chart.webp" alt=""></div>
  <div class="phone front"><img src="../../site/img/shot-logging.webp" alt=""></div>
  <div class="toast"><span class="cup">🏆</span><span><b>New record!</b><small>Leg press 10 × 180 lb</small></span></div>
  <img class="bunny" src="../../site/img/bunny-dumbbell.webp" alt="">
  <span class="spark" style="left:1128px;top:40px">✦</span>
  <span class="spark" style="left:860px;top:30px;font-size:22px;color:#f2879c">✦</span>
  <span class="spark" style="left:1150px;top:520px;font-size:24px;color:#b79cf0">✦</span>
</body>
</html>
